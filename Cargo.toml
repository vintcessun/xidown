[package]
name = "xidown"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
indicatif = "0.17.0-rc"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "macos-system-configuration", "brotli", "gzip", "json", "rustls-tls", "stream"] }
serde_json = "1.0.120"
tokio = { version = "1", features = ["full", "tracing"] }
log = "0.4.22"
threadpool = "1.8.1"
xmtv_api = "0.2.1"
env_logger = "0.11.8"
futures = "0.3.31"
async-std = "1.13.0"
biliup = { path = "./biliup" }
async_static = "0.1.3"
lazy_static = "1.5.0"
once_cell = "1.21.3"
bytes = "1.10.1"
serde = "1.0.219"
multi_log = "0.1.2"
chrono = "0.4.41"
simple_logger = "5.0.0"
fern = { version = "0.7.1", features = ["colored"] }
